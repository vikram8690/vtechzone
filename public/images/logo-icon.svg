<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" role="img" aria-label="vTechZone logo icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Circuit-V mark (white) -->
  <!-- Left arm: horizontal trace stub + diagonal to apex -->
  <polyline points="10,16 19,16 30,48" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm: horizontal trace stub + diagonal to apex -->
  <polyline points="50,16 41,16 30,48" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- PCB terminal nodes -->
  <circle cx="10" cy="16" r="3.5" fill="white"/>
  <circle cx="50" cy="16" r="3.5" fill="white"/>
  <circle cx="30" cy="48" r="3.5" fill="white"/>
  <!-- Junction nodes on stubs -->
  <circle cx="19" cy="16" r="2" fill="rgba(255,255,255,0.55)"/>
  <circle cx="41" cy="16" r="2" fill="rgba(255,255,255,0.55)"/>
</svg>
