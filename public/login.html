<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login – vTechZone</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="icon" type="image/svg+xml" href="/images/logo-icon.svg"/>
</head>
<body>
<nav class="navbar scrolled"><div class="nav-inner">
  <a href="/" class="nav-logo"><div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 26" width="22" height="22" aria-hidden="true"><polyline points="2,3 8,3 12,23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="22,3 16,3 12,23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2" cy="3" r="2" fill="white"/><circle cx="22" cy="3" r="2" fill="white"/><circle cx="12" cy="23" r="2" fill="white"/></svg></div><span>v<span>Tech</span>Zone</span></a>
  <div style="font-size:14px;color:var(--text-light)">Don't have an account? <a href="/signup" style="color:var(--primary);font-weight:600">Sign Up Free</a></div>
</div></nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 26" width="22" height="22" aria-hidden="true"><polyline points="2,3 8,3 12,23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="22,3 16,3 12,23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2" cy="3" r="2" fill="white"/><circle cx="22" cy="3" r="2" fill="white"/><circle cx="12" cy="23" r="2" fill="white"/></svg></div>
      <h2>Welcome Back!</h2>
      <p>Sign in to your vTechZone account</p>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" id="email" type="email" placeholder="you@email.com" required autofocus/>
        <div class="form-error" id="emailError">Please enter a valid email.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input class="form-input" id="password" type="password" placeholder="Enter your password" required style="padding-right:50px;"/>
          <button type="button" id="togglePwd" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-light);">👁</button>
        </div>
        <div class="form-error" id="pwdError">Please enter your password.</div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="loginBtn">
        Sign In →
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
      <p style="font-size:13px;color:var(--text-light);margin-bottom:12px;"><strong>Demo Credentials:</strong></p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="background:var(--light);padding:10px;border-radius:var(--radius);font-size:12px;text-align:center;">
          <div style="font-weight:600;color:var(--primary)">Admin</div>
          <div style="color:var(--text-light)">admin@vtechzone.in</div>
          <div style="color:var(--text-light)">Admin@123</div>
        </div>
        <div style="background:var(--light);padding:10px;border-radius:var(--radius);font-size:12px;text-align:center;">
          <div style="font-weight:600;color:var(--text)">User</div>
          <div style="color:var(--text-light)">Register first</div>
          <div style="color:var(--text-light)">Your password</div>
        </div>
      </div>
    </div>

    <div class="auth-footer">
      New to vTechZone? <a href="/signup">Create Account</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
// Redirect if already logged in
if (isLoggedIn()) window.location.href = isAdmin() ? 'admin.html' : 'dashboard.html';

document.getElementById('togglePwd').addEventListener('click', function() {
  const pwd = document.getElementById('password');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
  this.textContent = pwd.type === 'password' ? '👁' : '🙈';
});

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  let valid = true;

  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const emailErr = document.getElementById('emailError');
  const pwdErr = document.getElementById('pwdError');
  const emailEl = document.getElementById('email');
  const pwdEl = document.getElementById('password');

  if (!emailRe.test(email)) {
    emailEl.classList.add('error'); emailErr.classList.add('show'); valid = false;
  } else { emailEl.classList.remove('error'); emailErr.classList.remove('show'); }

  if (!password) {
    pwdEl.classList.add('error'); pwdErr.classList.add('show'); valid = false;
  } else { pwdEl.classList.remove('error'); pwdErr.classList.remove('show'); }

  if (!valid) return;

  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;"></div> Signing in...';
  btn.disabled = true;
  document.getElementById('errorAlert').classList.remove('show');

  try {
    const { ok, data } = await apiRequest('/auth/login', 'POST', { email, password });
    if (ok) {
      saveAuth(data.token, data.user);
      window.location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
    } else {
      document.getElementById('errorAlert').textContent = '❌ ' + (data.message || 'Login failed.');
      document.getElementById('errorAlert').classList.add('show');
    }
  } catch {
    document.getElementById('errorAlert').textContent = '❌ Network error. Make sure backend is running.';
    document.getElementById('errorAlert').classList.add('show');
  } finally {
    btn.innerHTML = 'Sign In →';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
